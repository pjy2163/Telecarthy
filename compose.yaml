services:
  media:
    image: livekit/livekit-server:v1.13.11
    container_name: telecarthy-demo-media
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./.local/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
